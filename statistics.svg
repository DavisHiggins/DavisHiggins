<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Statistics">
<title>Statistics</title>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px;
                fill: #6B7A93; text-transform: uppercase; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .num { font-size:38px; font-weight:800; letter-spacing:-1.4px; fill:#13294B; }
    .lab { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9px; letter-spacing:1.8px; fill:#6B7A93; }
    .sub { font-size:11px; fill:#2C4C7C; }
    .cell { opacity:0; transform:translateY(16px);
             animation: up .8s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { to { opacity:1; transform:translateY(0); } }
    .bar { fill:#13294B; transform-origin:left center;
            animation: grow 1.1s cubic-bezier(.16,1,.3,1) forwards; transform:scaleX(0); }
    @keyframes grow { to { transform:scaleX(1); } }
    .h { font-size:13px; font-weight:700; letter-spacing:3px; fill:#0A162C; }
    </style>
<rect width="900" height="250" fill="#FFFFFF"/>

<text class="eyebrow" x="56" y="46">Section 01</text>
<text class="h" x="56" y="72">STATISTICS</text>
<line x1="56" y1="86" x2="844" y2="86" class="rule"/>
<g class="cell" style="animation-delay:0.10s"><rect class="bar" x="56" y="96" width="34" height="3" style="animation-delay:0.30s"/><text class="num" x="56" y="146">3.89</text><text class="lab" x="56" y="168">GPA</text><text class="sub" x="56" y="188">Data Science &#183; AI minor</text></g>
<g class="cell" style="animation-delay:0.19s"><rect class="bar" x="187" y="96" width="34" height="3" style="animation-delay:0.39s"/><text class="num" x="187" y="146">5&#215;</text><text class="lab" x="187" y="168">CHANCELLOR'S LIST</text><text class="sub" x="187" y="188">Consecutive semesters</text></g>
<g class="cell" style="animation-delay:0.28s"><rect class="bar" x="318" y="96" width="34" height="3" style="animation-delay:0.48s"/><text class="num" x="318" y="146">10</text><text class="lab" x="318" y="168">ACTIVE PROJECTS</text><text class="sub" x="318" y="188">Web &#183; AI &#183; analytics</text></g>
<g class="cell" style="animation-delay:0.37s"><rect class="bar" x="449" y="96" width="34" height="3" style="animation-delay:0.57s"/><text class="num" x="449" y="146">20+</text><text class="lab" x="449" y="168">DASHBOARDS BUILT</text><text class="sub" x="449" y="188">Power BI &#183; Zoho</text></g>
<g class="cell" style="animation-delay:0.46s"><rect class="bar" x="580" y="96" width="34" height="3" style="animation-delay:0.66s"/><text class="num" x="580" y="146">15+</text><text class="lab" x="580" y="168">WEBSITES LAUNCHED</text><text class="sub" x="580" y="188">Personal + client</text></g>
<g class="cell" style="animation-delay:0.55s"><rect class="bar" x="711" y="96" width="34" height="3" style="animation-delay:0.75s"/><text class="num" x="711" y="146">2027</text><text class="lab" x="711" y="168">GRADUATION</text><text class="sub" x="711" y="188">UNC Charlotte</text></g>
<line x1="56" y1="214" x2="844" y2="214" class="rule"/>

</svg>
