name: Contribution snake

# Platane/snk always renders a full year in GitHub's green, so the animation is
# generated here instead: four months of squares, carolina blue into navy.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/generate_contribution_snake.py"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render the four-month contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/generate_contribution_snake.py
          --user DavisHiggins
          --months 4
          --out assets/contribution-snake.svg

      - name: Commit the refreshed animation
        run: |
          if git diff --quiet -- assets/contribution-snake.svg; then
            echo "No contribution changes today."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-snake.svg
          git commit -m "chore: refresh four-month contribution snake [skip ci]"
          git pull --rebase --autostash origin main
          git push
