<svg viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Davis Higgins technology and strategy stack">
  
  <defs>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8E7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122235" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#08111B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050B12" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7BAFD4" stroke-opacity=".055"/>
    </pattern>
    
  </defs>

  <style>
    :root {
      --bg: #03070B;
      --panel: #08111B;
      --panel-2: #0B1622;
      --blue: #7BAFD4;
      --blue-light: #C8E7FA;
      --white: #F7FBFF;
      --muted: #8EA2B4;
      --line: #193142;
    }
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans {
      font-family: "Helvetica Neue", Inter, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .trace {
      stroke-dasharray: 42 260;
      animation: trace 6.5s linear infinite;
    }
    .trace-slow {
      stroke-dasharray: 74 440;
      animation: trace 10s linear infinite reverse;
    }
    .wire {
      stroke-dasharray: 8 12;
      animation: wire 16s linear infinite;
    }
    .rise {
      opacity: 1;
      animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .fade {
      animation: fade 4.8s ease-in-out infinite;
    }
    .float {
      animation: float 5.5s ease-in-out infinite;
    }
    .pulse {
      animation: pulse 3.4s ease-in-out infinite;
    }
    .sweep {
      animation: sweep 7s linear infinite;
    }
    @keyframes trace { to { stroke-dashoffset: -604; } }
    @keyframes wire { to { stroke-dashoffset: -320; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      0%,100% { opacity: .28; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%,100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes sweep {
      from { transform: translateX(-240px); }
      to { transform: translateX(1440px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace,.trace-slow,.wire,.rise,.fade,.float,.pulse,.sweep {
        animation: none !important;
      }
      .rise { opacity: 1; }
    }
</style>
  <rect width="1200" height="380" rx="28" fill="#03070B"/>
  
  <g class="rise" style="animation-delay:0.08s">
    <rect x="24" y="24" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="24" y="24" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="50" y="64" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">DATA + ANALYTICS</text>
    <line x1="50" y1="82" x2="364" y2="82" stroke="#193142"/>
    <text x="50" y="112" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="50" dy="0">Python · SQL · Power BI</tspan><tspan x="50" dy="27">Tableau · Excel · Salesforce</tspan>
    </text>
  </g>

  <g class="rise" style="animation-delay:0.16s">
    <rect x="417" y="24" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="417" y="24" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="443" y="64" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">AI + AUTOMATION</text>
    <line x1="443" y1="82" x2="757" y2="82" stroke="#193142"/>
    <text x="443" y="112" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="443" dy="0">AI workflows · Claude Code</tspan><tspan x="443" dy="27">Prompt systems · Automation</tspan>
    </text>
  </g>

  <g class="rise" style="animation-delay:0.24s">
    <rect x="810" y="24" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="810" y="24" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="836" y="64" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">FRONTEND</text>
    <line x1="836" y1="82" x2="1150" y2="82" stroke="#193142"/>
    <text x="836" y="112" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="836" dy="0">Next.js · React · TypeScript</tspan><tspan x="836" dy="27">Tailwind · GSAP · Framer Motion</tspan>
    </text>
  </g>

  <g class="rise" style="animation-delay:0.32s">
    <rect x="24" y="202" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="24" y="202" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="50" y="242" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">BACKEND + PLATFORMS</text>
    <line x1="50" y1="260" x2="364" y2="260" stroke="#193142"/>
    <text x="50" y="290" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="50" dy="0">Vercel · Supabase · FastAPI</tspan><tspan x="50" dy="27">Content systems · APIs</tspan>
    </text>
  </g>

  <g class="rise" style="animation-delay:0.40s">
    <rect x="417" y="202" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="417" y="202" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="443" y="242" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">DESIGN + BRAND</text>
    <line x1="443" y1="260" x2="757" y2="260" stroke="#193142"/>
    <text x="443" y="290" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="443" dy="0">Branding · SEO · Editorial design</tspan><tspan x="443" dy="27">Web analytics · Motion</tspan>
    </text>
  </g>

  <g class="rise" style="animation-delay:0.48s">
    <rect x="810" y="202" width="366" height="154" rx="21" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="810" y="202" width="366" height="154" rx="21"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="836" y="242" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2.3">BUSINESS + STRATEGY</text>
    <line x1="836" y1="260" x2="1150" y2="260" stroke="#193142"/>
    <text x="836" y="290" class="sans" fill="#F7FBFF" font-size="15.5">
      <tspan x="836" dy="0">Digital strategy · Client websites</tspan><tspan x="836" dy="27">Personal branding · Systems thinking</tspan>
    </text>
  </g>

</svg>
