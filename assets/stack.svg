<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Davis Higgins technology, design, analytics, and strategy stack">
  
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#080F18"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <style>
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans { font-family: "Helvetica Neue", Inter, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none !important; opacity: 1 !important; }
    }
</style>
  <rect width="1200" height="360" rx="24" fill="#03070B"/>
  
  <g class="rise" style="animation-delay:0.08s">
    <rect x="24" y="24" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="50" y="24" width="48" height="2" fill="url(#edge)"/>
    <text x="50" y="68" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">DATA + ANALYTICS</text>
    <line x1="50" y1="86" x2="366" y2="86" stroke="#162836"/>
    <text x="50" y="116" class="sans" fill="#F7FBFF" font-size="15">Python · SQL · R</text>
    <text x="50" y="143" class="sans" fill="#8395A6" font-size="15">Power BI · Zoho · Excel</text>
  </g>

  <g class="rise" style="animation-delay:0.14s">
    <rect x="416" y="24" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="442" y="24" width="48" height="2" fill="url(#edge)"/>
    <text x="442" y="68" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">AI + AUTOMATION</text>
    <line x1="442" y1="86" x2="758" y2="86" stroke="#162836"/>
    <text x="442" y="116" class="sans" fill="#F7FBFF" font-size="15">Claude Code · AI workflows</text>
    <text x="442" y="143" class="sans" fill="#8395A6" font-size="15">Prompt systems · Agents</text>
  </g>

  <g class="rise" style="animation-delay:0.20s">
    <rect x="808" y="24" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="834" y="24" width="48" height="2" fill="url(#edge)"/>
    <text x="834" y="68" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">FRONTEND</text>
    <line x1="834" y1="86" x2="1150" y2="86" stroke="#162836"/>
    <text x="834" y="116" class="sans" fill="#F7FBFF" font-size="15">Next.js · React · TypeScript</text>
    <text x="834" y="143" class="sans" fill="#8395A6" font-size="15">Tailwind · GSAP · Framer Motion</text>
  </g>

  <g class="rise" style="animation-delay:0.26s">
    <rect x="24" y="192" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="50" y="192" width="48" height="2" fill="url(#edge)"/>
    <text x="50" y="236" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">BACKEND + PLATFORMS</text>
    <line x1="50" y1="254" x2="366" y2="254" stroke="#162836"/>
    <text x="50" y="284" class="sans" fill="#F7FBFF" font-size="15">Supabase · FastAPI · Vercel</text>
    <text x="50" y="311" class="sans" fill="#8395A6" font-size="15">APIs · Content systems</text>
  </g>

  <g class="rise" style="animation-delay:0.32s">
    <rect x="416" y="192" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="442" y="192" width="48" height="2" fill="url(#edge)"/>
    <text x="442" y="236" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">DESIGN + BRAND</text>
    <line x1="442" y1="254" x2="758" y2="254" stroke="#162836"/>
    <text x="442" y="284" class="sans" fill="#F7FBFF" font-size="15">Branding · Editorial design</text>
    <text x="442" y="311" class="sans" fill="#8395A6" font-size="15">SEO · Motion · Identity</text>
  </g>

  <g class="rise" style="animation-delay:0.38s">
    <rect x="808" y="192" width="368" height="144" rx="19" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="834" y="192" width="48" height="2" fill="url(#edge)"/>
    <text x="834" y="236" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="2.2">BUSINESS + STRATEGY</text>
    <line x1="834" y1="254" x2="1150" y2="254" stroke="#162836"/>
    <text x="834" y="284" class="sans" fill="#F7FBFF" font-size="15">Digital strategy · Client work</text>
    <text x="834" y="311" class="sans" fill="#8395A6" font-size="15">Systems thinking</text>
  </g>

</svg>
