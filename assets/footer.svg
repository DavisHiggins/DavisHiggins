<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Think. Build. Test. Ship.">
<title>Think. Build. Test. Ship.</title>
<defs>
  <linearGradient id="gFace" x1="0" y1="0" x2=".25" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".52" stop-color="#F8FBFE"/>
    <stop offset="1" stop-color="#EDF3FA"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4B9CD3" stop-opacity="0"/>
    <stop offset=".5" stop-color="#4B9CD3" stop-opacity=".85"/>
    <stop offset="1" stop-color="#4B9CD3" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ACEE7"/>
    <stop offset="1" stop-color="#13294B"/>
  </linearGradient>
  <linearGradient id="gGloss" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="gShadow" x="-12%" y="-24%" width="124%" height="156%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#13294B" flood-opacity=".10"/>
  </filter>
</defs>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px; fill: #6B7A93; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .word { font-size:42px; font-weight:800; letter-spacing:-1.4px; }
    .caret { fill:#4B9CD3; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .mail { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:13px; fill:#13294B; }
    .cap { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:2px; fill:#6B7A93; }
    .tick { fill:#E3E7EE; }
    .divBeam { animation: divBeam 6s linear infinite; }
    @keyframes divBeam { from { transform: translateX(0) } to { transform: translateX(908px) } }


    .m { display: none; }
    @media (max-width: 640px) {
      text { font-family: Helvetica,Arial,sans-serif; }
      .d { display: none; }
      .m { display: inline; }
    }
</style>
