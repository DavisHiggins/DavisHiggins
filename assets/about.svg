<svg viewBox="0 0 1200 166" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Davis Higgins at a glance: Charlotte NC, studying Data Science and AI, analyst at Kewaunee Scientific, founder of Higgins Digital">
  
  <defs>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8E7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122235" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#08111B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050B12" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7BAFD4" stroke-opacity=".055"/>
    </pattern>
    
  </defs>

  <style>
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans { font-family: "Helvetica Neue", Inter, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trace {
      stroke-dasharray: 42 260;
      animation: trace 6.5s linear infinite;
    }
    .trace-slow {
      stroke-dasharray: 74 440;
      animation: trace 10s linear infinite reverse;
    }
    .wire {
      stroke-dasharray: 8 12;
      animation: wire 16s linear infinite;
    }
    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes trace { to { stroke-dashoffset: -604; } }
    @keyframes wire { to { stroke-dashoffset: -320; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .trace-slow, .wire, .rise, .pulse {
        animation: none !important;
        opacity: 1 !important;
      }
    }
</style>
  <rect width="1200" height="166" rx="24" fill="#03070B"/>
  
  <g class="rise" style="animation-delay:0.08s">
    <rect x="24" y="24" width="272" height="118" rx="18" fill="#08111B"
          stroke="#193142" stroke-width="1.5"/>
    <rect x="48" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="48" y="68" class="mono" fill="#7BAFD4" font-size="11"
          font-weight="700" letter-spacing="2.4">LOCATION</text>
    <text x="48" y="106" class="sans" fill="#F7FBFF" font-size="19"
          font-weight="750">Charlotte, NC</text>
  </g>

  <g class="rise" style="animation-delay:0.15s">
    <rect x="316" y="24" width="272" height="118" rx="18" fill="#08111B"
          stroke="#193142" stroke-width="1.5"/>
    <rect x="340" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="340" y="68" class="mono" fill="#7BAFD4" font-size="11"
          font-weight="700" letter-spacing="2.4">STUDYING</text>
    <text x="340" y="106" class="sans" fill="#F7FBFF" font-size="19"
          font-weight="750">Data Science + AI</text>
  </g>

  <g class="rise" style="animation-delay:0.22s">
    <rect x="608" y="24" width="272" height="118" rx="18" fill="#08111B"
          stroke="#193142" stroke-width="1.5"/>
    <rect x="632" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="632" y="68" class="mono" fill="#7BAFD4" font-size="11"
          font-weight="700" letter-spacing="2.4">ANALYST</text>
    <text x="632" y="106" class="sans" fill="#F7FBFF" font-size="19"
          font-weight="750">Kewaunee Scientific</text>
  </g>

  <g class="rise" style="animation-delay:0.29s">
    <rect x="900" y="24" width="272" height="118" rx="18" fill="#08111B"
          stroke="#193142" stroke-width="1.5"/>
    <rect x="924" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="924" y="68" class="mono" fill="#7BAFD4" font-size="11"
          font-weight="700" letter-spacing="2.4">FOUNDER</text>
    <text x="924" y="106" class="sans" fill="#F7FBFF" font-size="19"
          font-weight="750">Higgins Digital</text>
  </g>

</svg>
