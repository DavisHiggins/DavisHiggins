<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 34" width="900" height="34" role="img" aria-label="Divider">
<title>Divider</title>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px;
                fill: #6B7A93; text-transform: uppercase; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .tick { fill:#E3E7EE; }
    .run { animation: run 6s linear infinite; }
    @keyframes run { 0% { transform:translateX(-120px) } 100% { transform:translateX(900px) } }
    </style>
