<svg viewBox="0 0 1200 690" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Davis Higgins experience timeline">
  
  <defs>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8E7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122235" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#08111B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050B12" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7BAFD4" stroke-opacity=".055"/>
    </pattern>
    
  </defs>

  <style>
    :root {
      --bg: #03070B;
      --panel: #08111B;
      --panel-2: #0B1622;
      --blue: #7BAFD4;
      --blue-light: #C8E7FA;
      --white: #F7FBFF;
      --muted: #8EA2B4;
      --line: #193142;
    }
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans {
      font-family: "Helvetica Neue", Inter, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .trace {
      stroke-dasharray: 42 260;
      animation: trace 6.5s linear infinite;
    }
    .trace-slow {
      stroke-dasharray: 74 440;
      animation: trace 10s linear infinite reverse;
    }
    .wire {
      stroke-dasharray: 8 12;
      animation: wire 16s linear infinite;
    }
    .rise {
      opacity: 1;
      animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .fade {
      animation: fade 4.8s ease-in-out infinite;
    }
    .float {
      animation: float 5.5s ease-in-out infinite;
    }
    .pulse {
      animation: pulse 3.4s ease-in-out infinite;
    }
    .sweep {
      animation: sweep 7s linear infinite;
    }
    @keyframes trace { to { stroke-dashoffset: -604; } }
    @keyframes wire { to { stroke-dashoffset: -320; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      0%,100% { opacity: .28; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%,100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes sweep {
      from { transform: translateX(-240px); }
      to { transform: translateX(1440px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace,.trace-slow,.wire,.rise,.fade,.float,.pulse,.sweep {
        animation: none !important;
      }
      .rise { opacity: 1; }
    }
</style>
  <rect width="1200" height="690" rx="28" fill="#03070B"/>
  <rect x="24" y="24" width="1152" height="642" rx="24" fill="url(#panelFill)"
        stroke="#193142" stroke-width="2"/>
  <rect class="trace-slow" x="24" y="24" width="1152" height="642" rx="24"
        fill="none" stroke="#7BAFD4" stroke-width="2.5"/>
  <line x1="88" y1="70" x2="88" y2="634" stroke="#193142" stroke-width="3"/>
  <line x1="88" y1="70" x2="88" y2="634" class="wire" stroke="#7BAFD4" stroke-width="2"/>
  
  <g class="rise" style="animation-delay:0.10s">
    <circle cx="88" cy="92" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="92" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="73" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">JAN 2026 — PRESENT</text>
    <text x="126" y="106" class="display" fill="#F7FBFF" font-size="23"
          letter-spacing="-.8">Founder &amp; Web Developer</text>
    <text x="700" y="106" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700">Higgins Digital</text>
    <text x="126" y="137" class="sans" fill="#8EA2B4" font-size="15">High-performance, brand-forward websites and digital systems for real businesses.</text>
  </g>

  <g class="rise" style="animation-delay:0.22s">
    <circle cx="88" cy="222" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="222" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="203" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">SEP 2025 — PRESENT</text>
    <text x="126" y="236" class="display" fill="#F7FBFF" font-size="23"
          letter-spacing="-.8">VP of Philanthropy &amp; Chaplain</text>
    <text x="700" y="236" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700">Phi Delta Theta</text>
    <text x="126" y="267" class="sans" fill="#8EA2B4" font-size="15">Chapter leadership, philanthropy, and a custom faith-centered digital resource hub.</text>
  </g>

  <g class="rise" style="animation-delay:0.34s">
    <circle cx="88" cy="352" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="352" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="333" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">JUN 2025 — PRESENT</text>
    <text x="126" y="366" class="display" fill="#F7FBFF" font-size="23"
          letter-spacing="-.8">Data Analyst</text>
    <text x="700" y="366" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700">Kewaunee Scientific</text>
    <text x="126" y="397" class="sans" fill="#8EA2B4" font-size="15">Power BI and Zoho dashboards, KPI reporting, auditing, and data governance.</text>
  </g>

  <g class="rise" style="animation-delay:0.46s">
    <circle cx="88" cy="482" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="482" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="463" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">MAY — AUG 2024</text>
    <text x="126" y="496" class="display" fill="#F7FBFF" font-size="23"
          letter-spacing="-.8">Assistant to Project Manager</text>
    <text x="700" y="496" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700">Higgins Building Group</text>
    <text x="126" y="527" class="sans" fill="#8EA2B4" font-size="15">Project operations, coordination, and documentation across active construction work.</text>
  </g>

  <g class="rise" style="animation-delay:0.58s">
    <circle cx="88" cy="612" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="612" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="593" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">DEC 2022 — MAY 2024</text>
    <text x="126" y="626" class="display" fill="#F7FBFF" font-size="23"
          letter-spacing="-.8">Operations Lead</text>
    <text x="700" y="626" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700">Teesly LLC</text>
    <text x="126" y="657" class="sans" fill="#8EA2B4" font-size="15">Daily operations, fulfillment, and process organization for a product business.</text>
  </g>

</svg>
