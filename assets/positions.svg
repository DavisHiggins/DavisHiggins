<g class="row" style="animation-delay:0.63s"><circle class="node" cx="60" cy="227" r="5"/><circle class="live" cx="60" cy="227" r="2" style="animation-delay:0.6s"/><text class="when" x="84" y="223">JUL 2026 &#8212; PRESENT</text><text class="role" x="84" y="243">Creative Director</text><text class="org" x="84" y="261">Lakeside Sport Club</text><text class="desc" x="380" y="243">Brand strategy, product development, and commerce operations.</text></g>
<g class="row" style="animation-delay:0.77s"><circle class="node" cx="60" cy="285" r="5"/><circle class="live" cx="60" cy="285" r="2" style="animation-delay:0.9s"/><text class="when" x="84" y="281">SEP 2025 &#8212; PRESENT</text><text class="role" x="84" y="301">VP of Philanthropy &amp; Chaplain</text><text class="org" x="84" y="319">Phi Delta Theta</text><text class="desc" x="380" y="301">Chapter leadership plus a custom digital study and resource hub.</text></g>

</svg>
