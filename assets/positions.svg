<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Current positions">
<title>Current positions</title>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px;
                fill: #6B7A93; text-transform: uppercase; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .h { font-size:13px; font-weight:700; letter-spacing:3px; fill:#0A162C; }
    /* Nothing starts hidden: GitHub renders this through an HTML img element and
       Chrome freezes the animation timeline at 0%, so an element that begins at
       opacity:0 or a full dashoffset would never become visible. */
    .spine { stroke:#E3E7EE; stroke-width:2; }
    .role { font-size:16px; font-weight:700; fill:#0A162C; }
    .org { font-size:13px; fill:#13294B; font-weight:600; }
    .desc { font-size:12px; fill:#6B7A93; }
    .when { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9px; letter-spacing:1.6px; fill:#6B7A93; }
    .node { fill:#FFFFFF; stroke:#13294B; stroke-width:2; }
    .live { fill:#13294B; animation: blink 2.6s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity:1 } 50% { opacity:.2 } }
    </style>
<rect width="900" height="330" fill="#FFFFFF"/>

<text class="eyebrow" x="56" y="46">Section 02</text>
