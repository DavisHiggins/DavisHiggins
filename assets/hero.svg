<text class="bin b" x="296" y="70" style="animation-delay:0.30s">1001001</text><text class="dec d" x="317" y="71" text-anchor="middle" style="animation-delay:0.30s">I</text>
<text class="bin b" x="352" y="70" style="animation-delay:0.40s">1010111</text><text class="dec d" x="373" y="71" text-anchor="middle" style="animation-delay:0.40s">W</text>
<text class="bin b" x="398" y="70" style="animation-delay:0.45s">1000101</text><text class="dec d" x="419" y="71" text-anchor="middle" style="animation-delay:0.45s">E</text>
<text class="bin b" x="444" y="70" style="animation-delay:0.50s">1000010</text><text class="dec d" x="465" y="71" text-anchor="middle" style="animation-delay:0.50s">B</text>
<text class="bin b" x="500" y="70" style="animation-delay:0.60s">1010011</text><text class="dec d" x="521" y="71" text-anchor="middle" style="animation-delay:0.60s">S</text>
<text class="bin b" x="546" y="70" style="animation-delay:0.65s">1011001</text><text class="dec d" x="567" y="71" text-anchor="middle" style="animation-delay:0.65s">Y</text>
<text class="bin b" x="592" y="70" style="animation-delay:0.70s">1010011</text><text class="dec d" x="613" y="71" text-anchor="middle" style="animation-delay:0.70s">S</text>
<text class="bin b" x="638" y="70" style="animation-delay:0.75s">1010100</text><text class="dec d" x="659" y="71" text-anchor="middle" style="animation-delay:0.75s">T</text>
<text class="bin b" x="684" y="70" style="animation-delay:0.80s">1000101</text><text class="dec d" x="705" y="71" text-anchor="middle" style="animation-delay:0.80s">E</text>
<text class="bin b" x="730" y="70" style="animation-delay:0.85s">1001101</text><text class="dec d" x="751" y="71" text-anchor="middle" style="animation-delay:0.85s">M</text>
<text class="bin b" x="776" y="70" style="animation-delay:0.90s">1010011</text><text class="dec d" x="797" y="71" text-anchor="middle" style="animation-delay:0.90s">S</text>

<g class="mark">
  <path d="M782 44 h20 a26 26 0 0 1 0 52 h-20 z"/>
  <path d="M828 44 v52 M828 70 h30 M858 44 v52"/>
