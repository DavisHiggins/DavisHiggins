<g class="meta" style="animation-delay:1.22s"><line x1="320" y1="256" x2="550" y2="256" class="rule"/><text class="metaK" x="320" y="276">STUDIO</text><text class="metaV" x="320" y="298">Higgins Digital</text><text class="metaS" x="320" y="316">Web + brand systems</text></g>
<g class="meta" style="animation-delay:1.34s"><line x1="584" y1="256" x2="814" y2="256" class="rule"/><text class="metaK" x="584" y="276">FOCUS</text><text class="metaV" x="584" y="298">Data / AI</text><text class="metaS" x="584" y="316">Dashboards, tools, agents</text></g>

