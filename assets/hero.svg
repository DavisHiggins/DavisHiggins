<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Davis Higgins - Data Science and AI">
<title>Davis Higgins - Data Science and AI</title>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px;
                fill: #6B7A93; text-transform: uppercase; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .frame { fill:none; stroke:#E3E7EE; stroke-width:1;
              stroke-dasharray:2480; stroke-dashoffset:2480;
              animation: draw 2.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset:0; } }

    .bin { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:8px; letter-spacing:1.2px; fill:#6B7A93; }
    .dec { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:12px; font-weight:700; fill:#13294B; opacity:0; }
    .b   { animation: bfade 9s infinite; }
    .d   { animation: dfade 9s infinite; }
    @keyframes bfade {
      0%,4% { opacity:.28 } 10% { opacity:1 } 22% { opacity:0 }
      88% { opacity:0 } 96%,100% { opacity:.28 } }
    @keyframes dfade {
      0%,20% { opacity:0 } 30%,86% { opacity:1 } 94%,100% { opacity:0 } }

    .name { font-size:76px; font-weight:800; letter-spacing:-2.6px; fill:#0A162C;
             opacity:0; transform:translateY(22px);
             animation: rise .95s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes rise { to { opacity:1; transform:translateY(0); } }

    .tag { font-size:16px; fill:#2C4C7C; opacity:0;
            animation: rise .9s .9s cubic-bezier(.16,1,.3,1) forwards; }
    .metaK { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9px; letter-spacing:2.2px; fill:#6B7A93; }
    .metaV { font-size:14px; font-weight:700; fill:#13294B; }
    .metaS { font-size:12px; fill:#6B7A93; }
    .meta { opacity:0; transform:translateY(14px);
             animation: rise .8s cubic-bezier(.16,1,.3,1) forwards; }

    .sweep { stroke:#13294B; stroke-width:2; stroke-dasharray:820;
              stroke-dashoffset:820; animation: draw 1.6s .7s cubic-bezier(.2,.7,.2,1) forwards; }
    .scan { animation: scan 9s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes scan { 0% { transform:translateX(-40px); opacity:0 }
                       8% { opacity:.5 } 60% { opacity:.5 }
                       75%,100% { transform:translateX(900px); opacity:0 } }

    .mark path, .mark line { stroke:#13294B; fill:none; stroke-width:2.4;
        stroke-dasharray:200; stroke-dashoffset:200;
        animation: draw 1.8s .3s cubic-bezier(.2,.7,.2,1) forwards; }
    .dot { fill:#13294B; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
    </style>
<rect width="900" height="340" fill="#FFFFFF"/>

<rect class="frame" x="20.5" y="20.5" width="859" height="299" rx="2"/>
<g class="scan"><rect x="0" y="21" width="1.5" height="298" fill="#13294B" opacity=".35"/></g>

