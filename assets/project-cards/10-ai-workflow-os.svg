<svg viewBox="0 0 570 166" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="AI Workflow OS: Practical courses and guides for people new to AI.">
  
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#080F18"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <style>
    
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans { font-family: "Helvetica Neue", Inter, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none !important; opacity: 1 !important; }
    }

    .panel, .view { transition: stroke .3s ease, transform .3s ease, fill .3s ease; }
    svg:hover .panel { stroke: #7BAFD4; }
    svg:hover .view { transform: translateX(4px); fill: #F7FBFF; }
  </style>
  <rect width="570" height="166" rx="20" fill="#03070B"/>
  <rect class="panel" x="1.5" y="1.5" width="567" height="163" rx="19"
        fill="#080F18" stroke="#162836" stroke-width="1.5"/>
  <rect x="28" y="1" width="60" height="2" fill="url(#edge)"/>

  <text x="28" y="38" class="mono" fill="#7BAFD4" font-size="11" font-weight="700"
        letter-spacing="2.2">10 / AI EDUCATION</text>
  <text x="542" y="38" class="mono" fill="#8395A6" font-size="10"
        letter-spacing="1.8" text-anchor="end">BUILDING</text>

  <text x="28" y="80" class="display" fill="#F7FBFF" font-size="24"
        letter-spacing="-1">AI Workflow OS</text>
  <text x="28" y="107" class="sans" fill="#8395A6" font-size="13.5">Practical courses and guides for people new to AI.</text>

  <line x1="28" y1="128" x2="542" y2="128" stroke="#162836"/>
  <text x="28" y="152" class="mono" fill="#8395A6" font-size="10.5"
        letter-spacing="1.3">AI WORKFLOWS · CLAUDE CODE · VERCEL</text>
  <text x="542" y="152" class="sans view" fill="#7BAFD4" font-size="12.5"
        font-weight="700" text-anchor="end">VIEW &#8599;</text>
</svg>
