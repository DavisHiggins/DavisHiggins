<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 144" width="450" height="144" role="img" aria-label="chaplain-platform on GitHub - Bible study calendar, 16-week scripture plan, and chapter engagement tools.">
<title>chaplain-platform on GitHub - Bible study calendar, 16-week scripture plan, and chapter engagement tools.</title>
<defs>
  <linearGradient id="gFace" x1="0" y1="0" x2=".25" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".52" stop-color="#F8FBFE"/>
    <stop offset="1" stop-color="#EDF3FA"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4B9CD3" stop-opacity="0"/>
    <stop offset=".5" stop-color="#4B9CD3" stop-opacity=".85"/>
    <stop offset="1" stop-color="#4B9CD3" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ACEE7"/>
    <stop offset="1" stop-color="#13294B"/>
  </linearGradient>
  <linearGradient id="gGloss" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="gShadow" x="-12%" y="-24%" width="124%" height="156%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#13294B" flood-opacity=".10"/>
  </filter>
</defs>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px; fill: #6B7A93; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .kind { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9.5px; letter-spacing:1.8px; fill:#3D7FB5; }
    .name { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:15px; font-weight:700; fill:#0A162C; }
    .desc { font-size:11.5px; fill:#6B7A93; }
</style>
<rect width="450" height="144" fill="#FFFFFF"/>

<rect x="32" y="20" width="386" height="104" rx="16" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="32.5" y="20.5" width="385" height="103" rx="15.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="48" y="21" width="354" height="1" fill="url(#gGloss)"/><rect x="32" y="34" width="3" height="76" rx="1.5" fill="url(#gAccent)"/>
