<text x="392" y="47" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="700" fill="#4B9CD3">&#8599;</text>
<text class="name" x="58" y="72">chaplain-platform</text>
<text class="desc" x="58" y="92">Bible study calendar, 16-week scripture plan, and chapter</text><text class="desc" x="58" y="107">engagement tools.</text>

