<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Current positions: Data Analyst at Kewaunee Scientific, JUN 2025 – PRESENT; Founder &amp; Web Developer at Higgins Digital, JAN 2026 – PRESENT; Creative Director &amp; Digital Commerce Lead at Lakeside Sport Club, JULY 2026 – PRESENT; VP of Philanthropy &amp; Chaplain at Phi Delta Theta, SEP 2025 – PRESENT">
  
  <defs>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8E7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122235" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#08111B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050B12" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7BAFD4" stroke-opacity=".055"/>
    </pattern>
    
  </defs>

  <style>
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans { font-family: "Helvetica Neue", Inter, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .trace {
      stroke-dasharray: 42 260;
      animation: trace 6.5s linear infinite;
    }
    .trace-slow {
      stroke-dasharray: 74 440;
      animation: trace 10s linear infinite reverse;
    }
    .wire {
      stroke-dasharray: 8 12;
      animation: wire 16s linear infinite;
    }
    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes trace { to { stroke-dashoffset: -604; } }
    @keyframes wire { to { stroke-dashoffset: -320; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .trace, .trace-slow, .wire, .rise, .pulse {
        animation: none !important;
        opacity: 1 !important;
      }
    }
</style>
  <rect width="1200" height="660" rx="28" fill="#03070B"/>
  <rect x="24" y="24" width="1152" height="612" rx="24" fill="url(#panelFill)"
        stroke="#193142" stroke-width="1.5"/>
  <rect class="trace-slow" x="24" y="24" width="1152" height="612" rx="24"
        fill="none" stroke="#7BAFD4" stroke-width="2.5"/>
  <line x1="88" y1="70" x2="88" y2="592" stroke="#193142" stroke-width="3"/>
  <line x1="88" y1="70" x2="88" y2="592" class="wire" stroke="#7BAFD4" stroke-width="2"/>
  
  <g class="rise" style="animation-delay:0.10s">
    <circle cx="88" cy="92" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="92" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="73" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">JUN 2025 – PRESENT</text>
    <text x="126" y="106" class="display" fill="#F7FBFF" font-size="22"
          letter-spacing="-.8">Data Analyst</text>
    <text x="1148" y="106" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700" text-anchor="end">Kewaunee Scientific</text>
    <text x="126" y="137" class="sans" fill="#8EA2B4" font-size="15"><tspan x="126" dy="0">Data analytics work spanning Power BI and Zoho Analytics dashboards, KPI reporting,</tspan><tspan x="126" dy="23">CRM/estimating auditing, and data governance.</tspan></text>
  </g>

  <g class="rise" style="animation-delay:0.22s">
    <circle cx="88" cy="232" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="232" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="213" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">JAN 2026 – PRESENT</text>
    <text x="126" y="246" class="display" fill="#F7FBFF" font-size="22"
          letter-spacing="-.8">Founder &amp; Web Developer</text>
    <text x="1148" y="246" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700" text-anchor="end">Higgins Digital</text>
    <text x="126" y="277" class="sans" fill="#8EA2B4" font-size="15"><tspan x="126" dy="0">Founder of a web design and development studio building high-performance,</tspan><tspan x="126" dy="23">brand-forward websites for real businesses.</tspan></text>
  </g>

  <g class="rise" style="animation-delay:0.34s">
    <circle cx="88" cy="372" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="372" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="353" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">JULY 2026 – PRESENT</text>
    <text x="126" y="386" class="display" fill="#F7FBFF" font-size="22"
          letter-spacing="-.8">Creative Director &amp; Digital Commerce Lead</text>
    <text x="1148" y="386" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700" text-anchor="end">Lakeside Sport Club</text>
    <text x="126" y="417" class="sans" fill="#8EA2B4" font-size="15"><tspan x="126" dy="0">Founded and manage a premium e-commerce apparel brand, leading brand strategy,</tspan><tspan x="126" dy="23">product development, website experience, merchandising, and digital commerce operations.</tspan></text>
  </g>

  <g class="rise" style="animation-delay:0.46s">
    <circle cx="88" cy="512" r="8" fill="#03070B" stroke="#7BAFD4" stroke-width="3"/>
    <circle cx="88" cy="512" r="3" fill="#C8E7FA" class="pulse"/>
    <text x="126" y="493" class="mono" fill="#7BAFD4" font-size="12"
          font-weight="700" letter-spacing="2">SEP 2025 – PRESENT</text>
    <text x="126" y="526" class="display" fill="#F7FBFF" font-size="22"
          letter-spacing="-.8">VP of Philanthropy &amp; Chaplain</text>
    <text x="1148" y="526" class="sans" fill="#C8E7FA" font-size="17"
          font-weight="700" text-anchor="end">Phi Delta Theta</text>
    <text x="126" y="557" class="sans" fill="#8EA2B4" font-size="15"><tspan x="126" dy="0">Chapter leadership across philanthropy and the chaplain role, including a custom digital</tspan><tspan x="126" dy="23">resource hub for Bible studies, leadership notes, and faith-centered materials.</tspan></text>
  </g>

</svg>
