<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 397" width="900" height="397" role="img" aria-label="Profile: data analyst, AI builder, and web developer based in Charlotte, North Carolina">
<title>Profile: data analyst, AI builder, and web developer based in Charlotte, North Carolina</title>
<defs>
  <linearGradient id="gFace" x1="0" y1="0" x2=".25" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".52" stop-color="#F8FBFE"/>
    <stop offset="1" stop-color="#EDF3FA"/>
  </linearGradient>
  <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4B9CD3" stop-opacity="0"/>
    <stop offset=".5" stop-color="#4B9CD3" stop-opacity=".85"/>
    <stop offset="1" stop-color="#4B9CD3" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gAccent" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9ACEE7"/>
    <stop offset="1" stop-color="#13294B"/>
  </linearGradient>
  <linearGradient id="gGloss" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <filter id="gShadow" x="-12%" y="-24%" width="124%" height="156%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#13294B" flood-opacity=".10"/>
  </filter>
</defs>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px; fill: #6B7A93; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .lead { font-size:14.5px; font-weight:600; fill:#0A162C; }
    .body { font-size:14.5px; fill:#2C4C7C; }
    .factK { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9px; letter-spacing:2px; fill:#6B7A93; }
    .factV { font-size:15px; font-weight:700; fill:#13294B; }
    .factN { font-size:11.5px; fill:#6B7A93; }
</style>
<rect width="900" height="397" fill="#FFFFFF"/>

<rect x="56" y="24" width="500" height="349" rx="18" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="56.5" y="24.5" width="499" height="348" rx="17.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="74" y="25" width="464" height="1" fill="url(#gGloss)"/><rect x="56" y="38" width="3" height="321" rx="1.5" fill="url(#gAccent)"/>
<text class="lead" x="86" y="58">I&#x27;m Davis Higgins — a data analyst, AI builder, and web developer</text><text class="lead" x="86" y="81">who turns complex ideas into useful digital products.</text><text class="body" x="86" y="122">I work across data, technology, and design to uncover insights, build</text><text class="body" x="86" y="145">intelligent tools, and create polished digital experiences that are</text><text class="body" x="86" y="168">both functional and memorable. My work spans analytics</text><text class="body" x="86" y="191">dashboards, agentic AI systems, full-stack applications, and</text><text class="body" x="86" y="214">brand-forward web experiences.</text><text class="body" x="86" y="255">Data Science and Artificial Intelligence student at UNC Charlotte,</text><text class="body" x="86" y="278">Data Analyst at Kewaunee Scientific, and founder of Higgins Digital.</text><text class="body" x="86" y="301">Actively seeking internship and project opportunities in data science,</text><text class="body" x="86" y="324">analytics, AI, and business intelligence.</text>
<rect x="576" y="24" width="268" height="76.75" rx="14" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="576.5" y="24.5" width="267" height="75.75" rx="13.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="590" y="25" width="240" height="1" fill="url(#gGloss)"/><rect x="576" y="38" width="3" height="48.75" rx="1.5" fill="url(#gAccent)"/><text class="factK" x="598" y="52">BASED IN</text><text class="factV" x="598" y="74">Charlotte, NC</text><text class="factN" x="598" y="92">UNC Charlotte &#x27;27</text><rect x="576" y="114.75" width="268" height="76.75" rx="14" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="576.5" y="115.25" width="267" height="75.75" rx="13.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="590" y="115.75" width="240" height="1" fill="url(#gGloss)"/><rect x="576" y="128.75" width="3" height="48.75" rx="1.5" fill="url(#gAccent)"/><text class="factK" x="598" y="142.75">STUDYING</text><text class="factV" x="598" y="164.75">Data Science</text><text class="factN" x="598" y="182.75">Artificial Intelligence</text><rect x="576" y="205.5" width="268" height="76.75" rx="14" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="576.5" y="206" width="267" height="75.75" rx="13.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="590" y="206.5" width="240" height="1" fill="url(#gGloss)"/><rect x="576" y="219.5" width="3" height="48.75" rx="1.5" fill="url(#gAccent)"/><text class="factK" x="598" y="233.5">ANALYST</text><text class="factV" x="598" y="255.5">Kewaunee Scientific</text><text class="factN" x="598" y="273.5">Power BI · Zoho</text><rect x="576" y="296.25" width="268" height="76.75" rx="14" fill="url(#gFace)" filter="url(#gShadow)"/><rect x="576.5" y="296.75" width="267" height="75.75" rx="13.5" fill="none" stroke="#DCE6F2" stroke-width="1"/><rect x="590" y="297.25" width="240" height="1" fill="url(#gGloss)"/><rect x="576" y="310.25" width="3" height="48.75" rx="1.5" fill="url(#gAccent)"/><text class="factK" x="598" y="324.25">FOUNDER</text><text class="factV" x="598" y="346.25">Higgins Digital</text><text class="factN" x="598" y="364.25">Web + brand systems</text>

