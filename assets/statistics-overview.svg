<svg viewBox="0 0 1200 440" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Statistics overview: dashboards, websites, active projects, GPA, and honors">
  
  <defs>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C8E7FA" stop-opacity="1"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122235" stop-opacity=".94"/>
      <stop offset=".55" stop-color="#08111B" stop-opacity=".9"/>
      <stop offset="1" stop-color="#050B12" stop-opacity=".96"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#7BAFD4" stroke-opacity=".055"/>
    </pattern>
    
  </defs>

  <style>
    
    :root {
      --bg: #03070B;
      --panel: #08111B;
      --panel-2: #0B1622;
      --blue: #7BAFD4;
      --blue-light: #C8E7FA;
      --white: #F7FBFF;
      --muted: #8EA2B4;
      --line: #193142;
    }
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans {
      font-family: "Helvetica Neue", Inter, Arial, sans-serif;
    }
    .mono {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    .trace {
      stroke-dasharray: 42 260;
      animation: trace 6.5s linear infinite;
    }
    .trace-slow {
      stroke-dasharray: 74 440;
      animation: trace 10s linear infinite reverse;
    }
    .wire {
      stroke-dasharray: 8 12;
      animation: wire 16s linear infinite;
    }
    .rise {
      opacity: 1;
      animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards;
    }
    .fade {
      animation: fade 4.8s ease-in-out infinite;
    }
    .float {
      animation: float 5.5s ease-in-out infinite;
    }
    .pulse {
      animation: pulse 3.4s ease-in-out infinite;
    }
    .sweep {
      animation: sweep 7s linear infinite;
    }
    @keyframes trace { to { stroke-dashoffset: -604; } }
    @keyframes wire { to { stroke-dashoffset: -320; } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      0%,100% { opacity: .28; }
      50% { opacity: 1; }
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%,100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes sweep {
      from { transform: translateX(-240px); }
      to { transform: translateX(1440px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trace,.trace-slow,.wire,.rise,.fade,.float,.pulse,.sweep {
        animation: none !important;
      }
      .rise { opacity: 1; }
    }

    .bar { transform:scaleX(0); transform-origin:left; animation:grow 1.4s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform:scaleX(1); } }
    @media (prefers-reduced-motion: reduce) { .bar{animation:none;transform:scaleX(1)} }
  </style>
  <rect width="1200" height="440" rx="28" fill="#03070B"/>
  
  <g class="rise" style="animation-delay:0.10s">
    <rect x="24" y="24" width="268" height="154" rx="22" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="24" y="24" width="268" height="154" rx="22"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="52" y="91" class="display" fill="#F7FBFF" font-size="52"
          letter-spacing="-2">20+</text>
    <text x="52" y="125" class="mono" fill="#C8E7FA" font-size="12"
          font-weight="700" letter-spacing="2">DASHBOARDS BUILT</text>
    <text x="52" y="154" class="sans" fill="#8EA2B4" font-size="13">Power BI · Zoho Analytics</text>
  </g>

  <g class="rise" style="animation-delay:0.18s">
    <rect x="316" y="24" width="268" height="154" rx="22" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="316" y="24" width="268" height="154" rx="22"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="344" y="91" class="display" fill="#F7FBFF" font-size="52"
          letter-spacing="-2">15+</text>
    <text x="344" y="125" class="mono" fill="#C8E7FA" font-size="12"
          font-weight="700" letter-spacing="2">WEBSITES LAUNCHED</text>
    <text x="344" y="154" class="sans" fill="#8EA2B4" font-size="13">Personal + client builds</text>
  </g>

  <g class="rise" style="animation-delay:0.26s">
    <rect x="608" y="24" width="268" height="154" rx="22" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="608" y="24" width="268" height="154" rx="22"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="636" y="91" class="display" fill="#F7FBFF" font-size="52"
          letter-spacing="-2">10</text>
    <text x="636" y="125" class="mono" fill="#C8E7FA" font-size="12"
          font-weight="700" letter-spacing="2">ACTIVE PROJECTS</text>
    <text x="636" y="154" class="sans" fill="#8EA2B4" font-size="13">Web · AI · analytics · writing</text>
  </g>

  <g class="rise" style="animation-delay:0.34s">
    <rect x="900" y="24" width="276" height="154" rx="22" fill="url(#panelFill)"
          stroke="#193142" stroke-width="2"/>
    <rect class="trace" x="900" y="24" width="276" height="154" rx="22"
          fill="none" stroke="#7BAFD4" stroke-width="2"/>
    <text x="928" y="91" class="display" fill="#F7FBFF" font-size="52"
          letter-spacing="-2">3.89</text>
    <text x="928" y="125" class="mono" fill="#C8E7FA" font-size="12"
          font-weight="700" letter-spacing="2">ACADEMIC GPA</text>
    <text x="928" y="154" class="sans" fill="#8EA2B4" font-size="13">Data Science + AI</text>
  </g>

  <rect x="24" y="202" width="1152" height="214" rx="22" fill="url(#panelFill)"
        stroke="#193142" stroke-width="2"/>
  <rect class="trace-slow" x="24" y="202" width="1152" height="214" rx="22"
        fill="none" stroke="#C8E7FA" stroke-width="2"/>

  <text x="54" y="244" class="mono" fill="#7BAFD4" font-size="12" letter-spacing="2.6">WORK SURFACE</text>
  <text x="54" y="291" class="display" fill="#F7FBFF" font-size="36">DATA → DECISION → EXPERIENCE</text>
  <text x="54" y="328" class="sans" fill="#8EA2B4" font-size="16">Analytics, intelligent automation, product engineering, and brand systems.</text>

  <g transform="translate(670 236)">
    <text x="0" y="0" class="mono" fill="#8EA2B4" font-size="11" letter-spacing="2">DATA + ANALYTICS</text>
    <rect x="0" y="14" width="400" height="7" rx="4" fill="#193142"/>
    <rect class="bar" x="0" y="14" width="362" height="7" rx="4" fill="#7BAFD4" style="animation-delay:.2s"/>
    <text x="0" y="55" class="mono" fill="#8EA2B4" font-size="11" letter-spacing="2">AI + AUTOMATION</text>
    <rect x="0" y="69" width="400" height="7" rx="4" fill="#193142"/>
    <rect class="bar" x="0" y="69" width="330" height="7" rx="4" fill="#C8E7FA" style="animation-delay:.35s"/>
    <text x="0" y="110" class="mono" fill="#8EA2B4" font-size="11" letter-spacing="2">WEB + PRODUCT</text>
    <rect x="0" y="124" width="400" height="7" rx="4" fill="#193142"/>
    <rect class="bar" x="0" y="124" width="378" height="7" rx="4" fill="#7BAFD4" style="animation-delay:.5s"/>
  </g>

  <circle cx="54" cy="382" r="5" fill="#7BAFD4" class="pulse"/>
  <text x="72" y="387" class="mono" fill="#C8E7FA" font-size="12" letter-spacing="1.5">
    5× CHANCELLOR’S LIST · EXCELLENCE IN WRITING
  </text>
</svg>
