<svg viewBox="0 0 1200 198" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Statistics overview: 20+ dashboards built, 15+ websites launched, 10 active projects, 3.89 GPA">
  
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#080F18"/>
    </linearGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#7BAFD4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#7BAFD4" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <style>
    .display {
      font-family: "Arial Black", "Helvetica Neue", Inter, Arial, sans-serif;
      font-weight: 900;
    }
    .sans { font-family: "Helvetica Neue", Inter, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .rise {
      opacity: 0;
      animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .pulse { animation: pulse 3.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .pulse { animation: none !important; opacity: 1 !important; }
    }
</style>
  <rect width="1200" height="198" rx="24" fill="#03070B"/>
  
  <g class="rise" style="animation-delay:0.08s">
    <rect x="24" y="24" width="272" height="150" rx="20" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="50" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="50" y="90" class="display" fill="#F7FBFF" font-size="50"
          letter-spacing="-2">20+</text>
    <text x="50" y="123" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="1.9">DASHBOARDS BUILT</text>
    <text x="50" y="150" class="sans" fill="#8395A6" font-size="13">Power BI · Zoho Analytics</text>
  </g>

  <g class="rise" style="animation-delay:0.15s">
    <rect x="316" y="24" width="272" height="150" rx="20" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="342" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="342" y="90" class="display" fill="#F7FBFF" font-size="50"
          letter-spacing="-2">15+</text>
    <text x="342" y="123" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="1.9">WEBSITES LAUNCHED</text>
    <text x="342" y="150" class="sans" fill="#8395A6" font-size="13">Personal + client builds</text>
  </g>

  <g class="rise" style="animation-delay:0.22s">
    <rect x="608" y="24" width="272" height="150" rx="20" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="634" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="634" y="90" class="display" fill="#F7FBFF" font-size="50"
          letter-spacing="-2">10</text>
    <text x="634" y="123" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="1.9">ACTIVE PROJECTS</text>
    <text x="634" y="150" class="sans" fill="#8395A6" font-size="13">Web · AI · analytics</text>
  </g>

  <g class="rise" style="animation-delay:0.29s">
    <rect x="900" y="24" width="272" height="150" rx="20" fill="#080F18"
          stroke="#162836" stroke-width="1.5"/>
    <rect x="926" y="24" width="52" height="2" fill="url(#edge)"/>
    <text x="926" y="90" class="display" fill="#F7FBFF" font-size="50"
          letter-spacing="-2">3.89</text>
    <text x="926" y="123" class="mono" fill="#7BAFD4" font-size="11.5"
          font-weight="700" letter-spacing="1.9">ACADEMIC GPA</text>
    <text x="926" y="150" class="sans" fill="#8395A6" font-size="13">Data Science + AI</text>
  </g>

</svg>
