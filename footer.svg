<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Think. Build. Test. Ship.">
<title>Think. Build. Test. Ship.</title>
<style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
    .mono { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
    .eyebrow { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size: 10px; letter-spacing: 2.4px;
                fill: #6B7A93; text-transform: uppercase; }
    .rule { stroke: #E3E7EE; stroke-width: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }

    .word { font-size:44px; font-weight:800; letter-spacing:-1.4px; fill:#0A162C;
             opacity:0; transform:translateY(18px);
             animation: up .8s cubic-bezier(.16,1,.3,1) forwards; }
    @keyframes up { to { opacity:1; transform:translateY(0); } }
    .word.n { fill:#13294B; }
    .mail { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:13px; fill:#13294B; letter-spacing:.4px; }
    .cap { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; font-size:9px; letter-spacing:2.2px; fill:#6B7A93; }
    .caret { fill:#13294B; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
    .track { animation: march 18s linear infinite; }
    @keyframes march { from { transform:translateX(0) } to { transform:translateX(-450px) } }
    </style>
<rect width="900" height="200" fill="#FFFFFF"/>

<line x1="56" y1="34" x2="844" y2="34" class="rule"/>
<text class="word"   x="56"  y="96" style="animation-delay:.05s">Think.</text>
<text class="word"   x="210" y="96" style="animation-delay:.17s">Build.</text>
<text class="word"   x="364" y="96" style="animation-delay:.29s">Test.</text>
<text class="word n" x="500" y="96" style="animation-delay:.41s">Ship.</text>
<rect class="caret" x="632" y="66" width="14" height="34"/>

<clipPath id="mq"><rect x="56" y="112" width="788" height="22"/></clipPath>
<g clip-path="url(#mq)">
  <g class="track">
    <text class="cap" x="56" y="128">LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; </text>
    <text class="cap" x="506" y="128">LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; LET'S BUILD &#8212; DATA &#183; AI &#183; WEB &#183; </text>
  </g>
</g>

<line x1="56" y1="152" x2="844" y2="152" class="rule"/>
<text class="mail" x="56" y="176">davishiggins@icloud.com</text>
<text class="cap" x="844" y="176" text-anchor="end">davishiggins.com &#169; 2026</text>

</svg>
